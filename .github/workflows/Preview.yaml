name: Action Preview

concurrency:
  group: "preview-${{ github.ref }}"
  cancel-in-progress: false

on:
  pull_request:
    branches:
      - main
  # Run by hand to lint chosen files. The result shows on the run summary page.
  workflow_dispatch:
    inputs:
      file-glob:
        description: Comma-separated files to lint, relative to the repo root (for example packages/sailpoint-rulesets/samples/path-ruleset/path-tag-check/invalid.yaml)
        required: true
        type: string

env:
  DEFAULT_FILES: packages/sailpoint-rulesets/samples/root-ruleset/root-tags-must-be-in-alphabetical-order/invalid.yaml,packages/sailpoint-rulesets/samples/path-ruleset/path-tag-check/invalid.yaml,packages/sailpoint-rulesets/samples/schema-ruleset/schema-properties-must-have-description/invalid.yaml,packages/gateway-rulesets/samples/sp-gateway-routes.yaml

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm build

      - name: Preview Action
        uses: ./packages/github-spectral-comment
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file-glob: ${{ inputs.file-glob || env.DEFAULT_FILES }}
          spectral-root-ruleset: ../../../sailpoint-rulesets/root-ruleset.yaml
          spectral-path-ruleset: ../../../sailpoint-rulesets/path-ruleset.yaml
          spectral-schema-ruleset: ../../../sailpoint-rulesets/schema-ruleset.yaml
          spectral-gateway-ruleset: ../../../gateway-rulesets/gateway-ruleset.yaml