# The path parameter has no example, schema.example or examples.
# expect: Rule 304: An example for id must be provided under one of the following keys: example, schema.example, examples
# expect-count: 1
get:
  operationId: getUser
  tags:
    - Users
  summary: Get a user
  description: Returns a single NERM user by its ID.
  parameters:
    - in: path
      name: id
      required: true
      description: The ID of the user.
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: The requested user.
