# The number query parameter uses a format that is not float, double or decimal.
# expect: Rule 171: score is type number and must be one of the following values: float, double, decimal
# expect-count: 1
get:
  operationId: getUser
  tags:
    - Users
  summary: Get a user
  description: Returns a single NERM user by its ID.
  parameters:
    - in: path
      name: id
      required: true
      description: The ID of the user.
      schema:
        type: string
        format: uuid
      example: 7b3c2f6a-1d4e-4c8a-9f2b-5e6d7a8b9c0d
    - in: query
      name: score
      required: false
      description: Minimum risk score of the user.
      schema:
        type: number
        format: int64
      example: 7.5
  responses:
    "200":
      description: The requested user.
