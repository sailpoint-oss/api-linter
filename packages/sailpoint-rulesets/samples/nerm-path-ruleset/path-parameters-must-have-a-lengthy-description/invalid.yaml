# The path parameter description has fewer than 8 characters.
get:
  operationId: getUser
  tags:
    - Users
  summary: Get a user
  description: Returns a single NERM user by its ID.
  parameters:
    - in: path
      name: id
      required: true
      description: User ID
      schema:
        type: string
        format: uuid
      example: 7b3c2f6a-1d4e-4c8a-9f2b-5e6d7a8b9c0d
  responses:
    "200":
      description: The requested user.
