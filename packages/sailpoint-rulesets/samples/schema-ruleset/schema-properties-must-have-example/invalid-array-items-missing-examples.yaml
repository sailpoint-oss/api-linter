                - ACCESS_PROFILE
                - ACCESS_REQUEST_APPROVAL
                - ACCOUNT
                - APPLICATION
                - CAMPAIGN
                - CAMPAIGN_FILTER
                - CERTIFICATION
                - CLUSTER
                - CONNECTOR_SCHEMA
                - ENTITLEMENT
                - GOVERNANCE_GROUP
                - IDENTITY
                - IDENTITY_PROFILE
                - IDENTITY_REQUEST
                - LIFECYCLE_STATE
                - PASSWORD_POLICY
                - ROLE
                - RULE
                - SOD_POLICY
                - SOURCE
                - TAG_CATEGORY
                - TASK_RESULT
                - REPORT_RESULT
                - SOD_VIOLATION
                - ACCOUNT_ACTIVITY
              description: An enumeration of the types of DTOs supported within the IdentityNow infrastructure.
              example: IDENTITY
            id:
              type: string
              description: ID of the object to which this reference applies
              example: 2c91808568c529c60168cca6f90c1313
            name:
              type: string
              description: Human-readable display name of the object to which this reference applies
              example: William Wilson
        currentOwner:
          type: object
          properties:
            type:
              type: string
