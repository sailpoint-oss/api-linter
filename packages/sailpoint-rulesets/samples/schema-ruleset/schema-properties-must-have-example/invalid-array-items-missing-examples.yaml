                - ACCESS_PROFILE
                - ACCESS_REQUEST_APPROVAL
                - ACCOUNT
                - APPLICATION
                - CAMPAIGN
                - CAMPAIGN_FILTER
                - CERTIFICATION
                - CLUSTER
                - CONNECTOR_SCHEMA
                - ENTITLEMENT
                - GOVERNANCE_GROUP
                - IDENTITY
                - IDENTITY_PROFILE
                - IDENTITY_REQUEST
                - LIFECYCLE_STATE
                - PASSWORD_POLICY
                - ROLE
                - RULE
                - SOD_POLICY
                - SOURCE
                - TAG_CATEGORY
                - TASK_RESULT
                - REPORT_RESULT
                - SOD_VIOLATION
                - ACCOUNT_ACTIVITY
              description: An enumeration of the types of DTOs supported within the IdentityNow infrastructure.
              example: IDENTITY
            id:
              type: string
              description: ID of the object to which this reference applies
              example: 2c91808568c529c60168cca6f90c1313
            name:
              type: string
              description: Human-readable display name of the object to which this reference applies
              example: William Wilson
        reviewedBy:
          type: object
          properties:
            type:
              type: string
              enum:
                - ACCOUNT_CORRELATION_CONFIG
                - ACCESS_PROFILE
                - ACCESS_REQUEST_APPROVAL
                - ACCOUNT
                - APPLICATION
                - CAMPAIGN
                - CAMPAIGN_FILTER
                - CERTIFICATION
                - CLUSTER
                - CONNECTOR_SCHEMA
                - ENTITLEMENT
                - GOVERNANCE_GROUP
                - IDENTITY
                - IDENTITY_PROFILE
                - IDENTITY_REQUEST
                - LIFECYCLE_STATE
                - PASSWORD_POLICY
                - ROLE
                - RULE
                - SOD_POLICY
                - SOURCE
                - TAG_CATEGORY
                - TASK_RESULT
                - REPORT_RESULT
                - SOD_VIOLATION
                - ACCOUNT_ACTIVITY
              description: An enumeration of the types of DTOs supported within the IdentityNow infrastructure.
              example: IDENTITY
            id:
              type: string
              description: ID of the object to which this reference applies
              example: 2c91808568c529c60168cca6f90c1313
            name:
              type: string
              description: Human-readable display name of the object to which this reference applies
              example: William Wilson
        modified:
          type: string
          format: date-time
          description: Time at which item was modified.
          example: '2019-08-23T18:52:57.398Z'
        status:
          type: string
          enum:
            - PENDING
            - APPROVED
            - REJECTED
            - EXPIRED
            - CANCELLED
            - ARCHIVED
          description: |-
            Indicates the state of the request processing for this item:
            * PENDING: The request for this item is awaiting processing.
            * APPROVED: The request for this item has been approved.
            * REJECTED: The request for this item was rejected.
            * EXPIRED: The request for this item expired with no action taken.
            * CANCELLED: The request for this item was cancelled with no user action.
            * ARCHIVED: The request for this item has been archived after completion.
          example: PENDING
        scheme:
          type: string
          enum:
            - APP_OWNER
            - SOURCE_OWNER
            - MANAGER
            - ROLE_OWNER
            - ACCESS_PROFILE_OWNER
            - GOVERNANCE_GROUP
          description: Describes the individual or group that is responsible for an approval step.
        errorMessages:
          type: array
          items:
            type: object
            properties:
              locale:
                type: string
                description: The locale for the message text, a BCP 47 language tag.
                example: en-US
              localeOrigin:
                type: string
                enum:
                  - DEFAULT
                  - REQUEST
                description: An indicator of how the locale was selected. *DEFAULT* means the locale is the system default. *REQUEST* means the locale was selected from the request context (i.e., best match based on the *Accept-Language* header). Additional values may be added in the future without notice.
                example: DEFAULT
              text:
                type: string
                description: Actual text of the error message in the indicated locale.
                example: The request was syntactically correct but its content is semantically invalid.
          description: If the request failed, includes any error messages that were generated.
        comment:
          type: string
          description: Comment, if any, provided by the approver.
        removeDate:
          type: string
          description: The date the role or access profile is no longer assigned to the specified identity.
          format: date-time
          example: '2020-07-11T00:00:00Z'
