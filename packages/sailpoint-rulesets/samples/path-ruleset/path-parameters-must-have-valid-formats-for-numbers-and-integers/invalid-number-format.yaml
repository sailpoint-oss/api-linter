# The number parameter uses int64, which is not a valid number format.
get:
  operationId: listIdentityOutliers
  tags:
    - Identity Outliers
  summary: List identity outliers
  description: Use this API to get a list of identity outliers.
  parameters:
    - in: query
      name: minScore
      required: false
      description: Only return outliers with a score at or above this value.
      schema:
        type: number
        format: int64
      example: 0.75
  responses:
    "200":
      description: List of identity outliers.
