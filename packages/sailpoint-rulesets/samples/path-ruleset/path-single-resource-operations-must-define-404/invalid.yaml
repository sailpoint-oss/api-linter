# The GET and DELETE on a single resource have no 404.
# expect: getIdentityV1
# expect: deleteIdentityV1
# expect-count: 2
get:
  operationId: getIdentityV1
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
  responses:
    "200":
      description: OK
delete:
  operationId: deleteIdentityV1
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
  responses:
    "204":
      description: No Content
