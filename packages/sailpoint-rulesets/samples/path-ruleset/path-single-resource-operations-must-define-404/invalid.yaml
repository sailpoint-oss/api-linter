# The PUT and DELETE on a single resource have no 404.
# expect: putIdentityV1
# expect: deleteIdentityV1
# expect-count: 2
put:
  operationId: putIdentityV1
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
  responses:
    "200":
      description: OK
delete:
  operationId: deleteIdentityV1
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
  responses:
    "204":
      description: No Content
