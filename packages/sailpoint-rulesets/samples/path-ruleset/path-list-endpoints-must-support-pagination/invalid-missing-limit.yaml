# The list operation has an offset query parameter but no limit query parameter.
# expect: must have limit as a query parameter
# expect-count: 1
get:
  operationId: listIdentities
  tags:
    - Identities
  summary: List identities
  description: Use this API to get a list of identities.
  parameters:
    - in: query
      name: offset
      required: false
      description: Offset into the full result set.
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 0
  responses:
    "200":
      description: List of identities.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
