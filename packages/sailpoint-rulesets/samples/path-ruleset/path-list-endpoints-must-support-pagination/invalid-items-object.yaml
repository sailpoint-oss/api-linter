# The list operation returns an object with an items array (rule 110), but has no offset or limit query parameter.
# expect: must have offset as a query parameter
# expect: must have limit as a query parameter
# expect-count: 2
get:
  operationId: listWorkflows
  summary: List workflows
  description: Use this API to get a list of workflows.
  responses:
    "200":
      description: List of workflows.
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  type: object
