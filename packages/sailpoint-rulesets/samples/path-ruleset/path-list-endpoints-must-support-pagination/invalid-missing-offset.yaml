# The list operation has a limit query parameter but no offset query parameter.
# expect: must have offset as a query parameter
# expect-count: 1
get:
  operationId: listIdentities
  tags:
    - Identities
  summary: List identities
  description: Use this API to get a list of identities.
  parameters:
    - in: query
      name: limit
      required: false
      description: Max number of results to return.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 250
      example: 250
  responses:
    "200":
      description: List of identities.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
