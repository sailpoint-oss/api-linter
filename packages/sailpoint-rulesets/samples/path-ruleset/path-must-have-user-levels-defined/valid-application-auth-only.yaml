# The operation uses only applicationAuth, so it needs no x-sailpoint-userLevels.
get:
  operationId: getIdentity
  tags:
    - Identities
  summary: Get an identity
  description: Use this API to get a single identity by its ID.
  security:
    - applicationAuth: [idn:identity:read]
  responses:
    "200":
      description: The identity.
