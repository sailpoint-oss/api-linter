# Bug check: path-level parameters and summary are not operations and need no security. Fails while given $.* checks every path-item key.
summary: Identity by ID
parameters:
  - in: path
    name: id
    required: true
    description: The ID of the identity.
    schema:
      type: string
    example: 2c9180835d2e5168015d32f890ca1581
get:
  operationId: getIdentity
  tags:
    - Identities
  summary: Get an identity
  description: Use this API to get a single identity by its ID.
  security:
    - userAuth: [idn:identity:read]
    - applicationAuth: [idn:identity:read]
  x-sailpoint-userLevels:
    - ORG_ADMIN
  responses:
    "200":
      description: The identity.
