# Top-level properties use camelCase, and nested properties use dot notation.
get:
  operationId: listViolations
  summary: List violations
  description: Use this API to get a list of violations.
  parameters:
  - in: query
    name: filters
    required: false
    schema:
      type: string
    example: id eq "2c9180835d2e5168015d32f890ca1581"
    description: >-
      Filter results using the standard syntax described in [API Standard Collection
      Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#filtering-results)


      Filtering is supported for the following fields and operators:


      **id**: *eq, in*


      **ownerId**: *eq*


      **policy.id**: *eq, in*


      **policy.name**: *eq, sw*


      **startTime**: *gt, lt*


      **search**: *eq*
  responses:
    "200":
      description: List of violations.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "./response-item.yaml"
