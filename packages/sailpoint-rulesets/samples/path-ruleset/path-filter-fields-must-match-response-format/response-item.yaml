# A helper file for the samples in this folder. It is not a sample.
type: object
properties:
  id:
    type: string
    description: The ID of the violation.
  startTime:
    type: string
    format: date-time
    description: The time that the violation started.
  ownerId:
    type: string
    description: The ID of the owner, as a top-level property.
  policy:
    type: object
    properties:
      id:
        type: string
        description: The ID of the policy.
      name:
        type: string
        description: The name of the policy.
