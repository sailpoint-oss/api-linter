# The filters description does not start with the standard intro text.
# expect: Rule 324: The first two lines in the description for filters must follow the example provided in the guide for rule 324.
# expect-count: 1
get:
  operationId: listAccessProfiles
  tags:
    - Access Profiles
  summary: List access profiles
  description: Use this API to get a list of access profiles.
  parameters:
    - in: query
      name: filters
      required: false
      schema:
        type: string
      example: name eq "Finance Access"
      description: |-
        Filter the access profiles by name or ID.

        Filtering is supported for the following fields and operators:

        **name**: *eq, sw*
  responses:
    "200":
      description: List of access profiles.
