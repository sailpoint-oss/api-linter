# The operator list for a property has extra text in parentheses.
# expect: Rule 324: The operators for id must be separated with commas and spaces (ex. *eq, co, le*).
# expect-count: 1
get:
  operationId: listAccessProfiles
  tags:
    - Access Profiles
  summary: List access profiles
  description: Use this API to get a list of access profiles.
  parameters:
    - in: query
      name: filters
      required: false
      schema:
        type: string
      example: name eq "Finance Access"
      description: |-
        Filter results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#filtering-results)

        Filtering is supported for the following fields and operators:

        **id**: *eq, in (not valid), co*
  responses:
    "200":
      description: List of access profiles.
