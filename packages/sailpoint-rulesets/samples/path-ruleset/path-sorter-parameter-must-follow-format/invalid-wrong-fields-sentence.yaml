# The second paragraph does not use the "Sorting is supported for the following fields:" sentence.
# expect: Rule 325: Must use the following format when describing sortable fields: "Sorting is supported for the following fields: **name, created, etc**".
# expect-count: 1
get:
  operationId: listAccessProfiles
  tags:
    - Access Profiles
  summary: List access profiles
  description: Use this API to get a list of access profiles.
  parameters:
    - in: query
      name: sorters
      required: false
      schema:
        type: string
        format: comma-separated
      example: name,-modified
      description: |-
        Sort results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)

        You can sort on the following fields: **name, created, modified**
  responses:
    "200":
      description: List of access profiles.
