# The sortable fields include a dash, which is not allowed.
# expect: Rule 325: Dashes are not allowed when listing supported fields.  Fields must support both ascending and descending.
# expect-count: 1
get:
  operationId: listAccessProfiles
  tags:
    - Access Profiles
  summary: List access profiles
  description: Use this API to get a list of access profiles.
  parameters:
    - in: query
      name: sorters
      required: false
      schema:
        type: string
        format: comma-separated
      example: name,-modified
      description: |-
        Sort results using the standard syntax described in [API Standard Collection Parameters](https://developer.sailpoint.com/docs/api/standard-collection-parameters#sorting-results)

        Sorting is supported for the following fields: **name, -created, modified**
  responses:
    "200":
      description: List of access profiles.
