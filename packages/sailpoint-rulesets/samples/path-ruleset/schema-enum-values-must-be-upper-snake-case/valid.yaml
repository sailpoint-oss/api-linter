# The enum values are UPPER_SNAKE_CASE or ISO language codes.
get:
  operationId: listIdentitiesV1
  parameters:
    - in: query
      name: state
      required: false
      schema:
        type: string
        enum:
          - ACTIVE
          - INACTIVE
    - in: path
      name: locale
      required: true
      schema:
        type: string
        enum:
          - en
          - en-US
          - de
