# The subroute config has a property that the gateway does not know.
# expect: /items has an invalid field: rights
dynamic-rate-limits:
  acme:
    sample-dynamic-invalid-sub-v1:
      rateLimit: 10
      rateLimitIntervalSeconds: 60
      subroutes:
        "/items":
          rateLimit: 5
          rateLimitIntervalSeconds: 60
          rights: ["some-right"]
