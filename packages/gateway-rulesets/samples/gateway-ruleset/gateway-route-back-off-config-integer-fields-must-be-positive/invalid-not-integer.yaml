# redisTimeoutMs is a decimal, and tierMemoryWindow is a string.
# The sample has all four fields, because the rule also reports a missing field.
# expect-count: 2
sp-gateway:
  routes:
    - id: "sample-route-49-v1"
      path: "/sample-route-49/v1"
      service: "identity"
      routeType: "prefix"
      stripPrefix: true
      apiState: "public"
      backOffConfig:
        intervalThreshold: 1
        violationWindow: 60
        tierMemoryWindow: "300"
        redisTimeoutMs: 1.5
