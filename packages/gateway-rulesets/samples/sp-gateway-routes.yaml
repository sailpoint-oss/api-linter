sp-gateway:
  routes:
    # Good routes
    - id: "access-request-test-v1"
      path: "/access-request-path/v1"
      service: "access-request-service"
      servicePath: "/test/access-request-administration"
      routeType: "prefix"
      stripPrefix: true
      stripPrefixPath: "/access-request-path/v1"
      apiState: "limited-preview"

    - id: "subroute-test-internal"
      service: "identity"
      path: "/subroute-path/internal"
      routeType: "prefix"
      stripPrefix: true
      apiState: "public"
      subroutes:
        "/some/route/{id}":
          rights: ["some-right"]
          methods: ["GET", "POST"]
          rateLimit: 100
          rateLimitIntervalSeconds: 10

    # Bad routes - should return errors
    - id: "access-request-test-internal"
      path: "/access-request-path/v1"
      service: "access-request-service"
      servicePath: "/test/access-request-administration"
      routeType: "prefix"
      stripPrefix: true
      stripPrefixPath: "/access-request-path/v1"
      apiState: "limited-preview"

    - id: "access-request-test"
      path: "/access-request-path/v1"
      service: "access-request-service"
      servicePath: "/test/access-request-administration"
      routeType: "prefix"
      stripPrefix: true
      stripPrefixPath: "/access-request-path/v1"
      apiState: "limited-preview"

    - id: "access-request-test-v2"
      path: "/access-request-path"
      service: "access-request-service"
      servicePath: "/test/access-request-administration"
      routeType: "prefix"
      stripPrefix: true
      stripPrefixPath: "/access-request-path/v2"
      apiState: "limited-preview"

    # Intentional violations for backOffConfig rules
    - id: "back-off-config-test-v2"
      path: "/back-off-config-test/v2"
      service: "identity"
      routeType: "prefix"
      stripPrefix: true
      apiState: "public"
      backOffConfig:
        enabled: "yes"          # violation: must be boolean, not string
        intervalThreshold: -5   # violation: must be a positive integer
        tiers: [30, "sixty", 90] # violation: tiers must be an array of integers
        violationWindow: 0      # violation: must be >= 1
        tierMemoryWindow: 300
        redisTimeoutMs: 50
        unknownField: "oops"    # violation: unknown property
